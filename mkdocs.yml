site_name: sitecrawler
site_description: SEO site-audit crawler
repo_url: https://github.com/joemachen/sitecrawler
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

nav:
  - Home: index.md
  - User guide:
      - Crawling a site: user-guide/crawl.md
      - JavaScript rendering: user-guide/render.md
      - Custom extraction and search: user-guide/extract.md
      - Storage: user-guide/storage.md
      - List mode: user-guide/list-mode.md
      - Exporting: user-guide/export.md
      - Auditing: user-guide/audit.md
      - Audit rules: user-guide/rules.md
      - Sitemaps: user-guide/sitemaps.md
      - Browsing a crawl: user-guide/serve.md
  - Project:
      - Development process: DEVELOPMENT.md
      - Architecture: ARCHITECTURE.md
      - Roadmap: ROADMAP.md
      - Decisions:
          - Index: adr/README.md
          - 0001 Python, uv, SQLite: adr/0001-python-uv-sqlite-stack.md
          - 0002 CLI first: adr/0002-cli-first-web-ui-later.md
          - 0003 httpx and redirects: adr/0003-httpx-asyncio-manual-redirects.md
          - 0004 One crawl per file: adr/0004-one-crawl-per-file-and-resume.md
          - 0005 Rules as code and docs: adr/0005-rules-as-code-and-docs.md
          - 0006 Web UI snapshot and grids: adr/0006-web-ui-snapshot-and-client-grids.md
          - 0007 Live crawl session: adr/0007-live-crawl-session.md
          - 0008 Render every page, keep the diff: adr/0008-render-every-page-and-keep-the-diff.md
          - 0009 Extract in the crawl pass: adr/0009-extract-in-the-crawl-pass.md
          - 0010 Sitemap audit as page rules: adr/0010-sitemap-audit-as-page-rules.md
  - API reference: reference.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
