[project]
name = "sitecrawler"
version = "0.3.0"
description = "SEO site-audit crawler: crawl a site, store every page, report the issues."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Joe Machen", email = "joemachen@gmail.com" }]
keywords = ["seo", "crawler", "audit", "sitemap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "beautifulsoup4>=4.13",
  "lxml>=5.3",
  "typer>=0.15",
  "rich>=13.9",
  "httpx[http2]>=0.28",
  "sqlalchemy>=2.0",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "jinja2>=3.1",
]

[project.scripts]
sitecrawler = "sitecrawler.cli.main:app"

[project.urls]
Repository = "https://github.com/joemachen/sitecrawler"

[dependency-groups]
dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "lxml-stubs>=0.5",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-httpserver>=1.1",
  "pre-commit>=4.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "types-openpyxl>=3.1.5.20261017",
  "playwright>=1.49",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecrawler"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "PT",        # pytest style
  "D",         # pydocstyle (public API only, see below)
  "C4",        # comprehensions
  "RET",       # return
  "ARG",       # unused arguments
  "PTH",       # use pathlib
  "T20",       # no stray print()
]
ignore = [
  "D100", "D104",  # module/package docstrings not required
  "D203", "D213",  # conflicting pydocstyle pairs; keep D211/D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG", "T20"]
"src/sitecrawler/cli/**" = ["T20"]
"src/sitecrawler/audit/rules/**" = ["ARG002"]  # rule hooks share one signature

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pytest_httpserver.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: hits the real network; never run in CI",
  "browser: drives headless Chromium; needs `uv run playwright install chromium`",
]
filterwarnings = [
  # Starlette 1.9 prefers httpx2 for its test client; httpx 0.28 still works.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["sitecrawler"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
