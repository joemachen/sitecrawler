{% extends "base.html" %}
{% block title %}Pages · sitecrawler{% endblock %}
{% block content %}
<section class="grid">
  <div class="toolbar">
    <input type="search" placeholder="Search every column" aria-label="Search" data-grid-search>
    <span class="count" data-grid-count></span>
    <button type="button" data-grid-download>Download CSV</button>
  </div>
  <div data-grid="/api/pages" data-columns='{{ columns | tojson }}' data-download="pages.csv"></div>
</section>
{% endblock %}
