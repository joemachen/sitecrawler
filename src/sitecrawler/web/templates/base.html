<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sitecrawler{% endblock %}</title>
  <link rel="stylesheet" href="/static/tabulator.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/tabulator.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% block body %}
  <header class="bar">
    <a class="brand" href="/">sitecrawler</a>
    <a class="back" href="/">Back to the crawl</a>
    <span class="crawl" title="{{ state.db or '' }}">{{ state.start_url }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
{% endblock %}
</body>
</html>
