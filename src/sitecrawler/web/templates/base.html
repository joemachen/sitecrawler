<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sitecrawler{% endblock %}</title>
  <link rel="stylesheet" href="/static/tabulator.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/tabulator.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">sitecrawler</a>
    <nav>
      {% for href, label in tabs %}
      <a href="{{ href }}"{% if active == label %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <span class="crawl" title="{{ snapshot.path }}">{{ snapshot.info.start_url }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
