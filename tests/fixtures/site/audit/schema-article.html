<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>An article marked up in RDFa with few properties</title>
  <meta name="description" content="Unique words for schema-article: RDFa Lite article with a headline and a date, but no image, author or modified date for its rich result.">
  <link rel="canonical" href="/audit/schema-article">
</head>
<body>
  <article vocab="https://schema.org/" typeof="Article">
    <h1 property="headline">Glazing at home</h1>
    <h2>Details</h2>
    <meta property="datePublished" content="2026-10-01">
    <p>Fixture page for one audit rule: Google would like more about this article.</p>
  </article>
</body>
</html>
